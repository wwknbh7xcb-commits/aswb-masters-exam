name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: cd aswb-exam-hub-v1 && npm install

      - run: cd aswb-exam-hub-v1 && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./aswb-exam-hub-v1/dist

      - uses: actions/deploy-pages@v4
